# Homelab values for this chart, layered over values.yaml beside it. Rendered
# by the `socialapp-app` Argo CD Application (../../terraform/argocd.tf).
#
# values.yaml owns the chart's defaults; this file owns what is specific to the
# homelab cluster: domains, in-cluster service addresses, and exactly which
# image digests run.
#
# It lives inside the chart directory, not under socialapp/deploy/, for one
# reason: the image workflow commits digests here, and socialapp/helm/** is
# excluded from that workflow's own trigger. A digest commit therefore cannot
# start another build, whatever token pushed it.

api:
  # Pinned by digest, so the running version is recorded in Git and a rollback
  # is a revert. The Socialapp Image workflow
  # (.github/workflows/build-socialapp-image.yml) rewrites these three image
  # lines on each build.
  image: ghcr.io/igomez10/socialapp@sha256:9f32b22efc7c1ea11a79bf0a359c8db18963108370f74ea1e034ba74755b89ef

  config:
    PORT: "8086"
    LOG_LEVEL: info

    # The public hostnames (SOCIALAPP_SUBDOMAIN, LOCAL_SUBDOMAIN,
    # PROPERTIES_SUBDOMAIN, URLSHORTENER_SUBDOMAIN, KIBANA_SUBDOMAIN,
    # PUTTYKNIFE_DOMAIN) are deliberately not here. This repo is public and the
    # domain is kept out of it: the Argo CD Application passes them as inline
    # Helm values built from Terraform's var.domain
    # (../../terraform/argocd.tf), which override this file.

    # The URL shortener is real and in-cluster — homelab/apps/urlshortener, in
    # its own namespace, reached across namespaces by Service DNS.
    URLSHORTENER_URL: http://urlshortener.urlshortener.svc.cluster.local:8089

    # These two name services that exist in the compose stack on the OCI VM and
    # do NOT exist in this cluster. They are set because the app refuses to
    # start without them, not because they resolve. Kibana links and puttyknife
    # lookups fail until those services arrive.
    KIBANA_URL: http://kibana.socialapp.svc.cluster.local:5601
    PUTTYKNIFE_URL: http://puttyknife-server.puttyknife.svc.cluster.local:8096

    # The cluster-local collector (homelab/apps/otel-collector), which forwards
    # traces to Tempo.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
    LOGSTASH_HOST: logstash.socialapp.svc.cluster.local:5044
    OTEL_SERVICE_NAME: socialapp

migrate:
  image: ghcr.io/igomez10/socialapp-migrate@sha256:8fabd54daf310597e3b4ba8a1f8ffcc073f41220736d77c0a1a1b874722f2b44

frontend:
  image: ghcr.io/igomez10/socialapp-frontend@sha256:83b008a0fc1c56fc8f1fa5623934e9f64cd2c13f808938cc8321bbb684086def
