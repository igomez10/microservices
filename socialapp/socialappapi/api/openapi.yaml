openapi: 3.1.0
info:
  contact:
    email: ignacio.gomez.arboleda@gmail.com
    name: Socialapp
    url: https://socialapp.gomezignacio.com
  description: |
    Socialapp API for user management, social interactions, authorization,
    and shortened URL operations.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://socialapp.gomezignacio.com/terms
  title: Socialapp
  version: 1.0.0
servers:
- description: Production
  url: https://socialapp.gomezignacio.com
- description: Local development (API server)
  url: http://localhost:8080
- description: Local development (alternate port)
  url: http://localhost:8085
security:
- OAuth2: []
tags:
- description: User account lifecycle and profile operations
  name: User
- description: Comment creation and retrieval operations
  name: Comment
- description: Authentication and access token operations
  name: Authentication
- description: Follower and following relationship operations
  name: Following
- description: Role administration operations
  name: Role
- description: OAuth scope administration operations
  name: Scope
- description: "Short URL creation, redirect, and metadata operations"
  name: URL
paths:
  /:
    get:
      description: Return a welcome message for the Socialapp API.
      operationId: welcome
      responses:
        "200":
          content:
            text/plain:
              example: Welcome to the Socialapp API
              schema:
                type: string
          description: Welcome message
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Unauthorized
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              example:
                code: 500
                message: Unexpected error
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Get API welcome message
      tags:
      - User
  /v1/users:
    get:
      description: List users with offset-based pagination.
      operationId: listUsers
      parameters:
      - description: Maximum number of users to return
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Pagination offset
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: "Case-insensitive user search across username, first name, last\
          \ name, and email"
        example: john
        explode: true
        in: query
        name: search
        required: false
        schema:
          default: ""
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 1
                username: johndoe
                first_name: John
                last_name: Doe
                email: johndoe@mail.com
                created_at: 2020-01-01T00:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: List of all the users
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.list
      summary: List users
      tags:
      - User
    post:
      description: Create a new user.
      operationId: createUser
      requestBody:
        content:
          application/json:
            example:
              username: johndoe
              first_name: John
              last_name: Doe
              password: Secure123!
              email: johndoe@mail.com
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        description: Create a new user
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: 1
                username: johndoe
                first_name: John
                last_name: Doe
                email: johndoe@mail.com
                created_at: 2020-01-01T00:00:00Z
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
          description: User was created successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      summary: Create user
      tags:
      - User
  /v1/password:
    post:
      description: Change the password for the authenticated user.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            example:
              old_password: Secure123!
              new_password: Secure1234!
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        description: Change password request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Password was changed successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.update
      summary: Change password
      tags:
      - User
    put:
      description: Reset a user's password using their email address.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            example:
              email: johndoe@mail.com
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        description: Reset password
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Password was reset successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.update
      summary: Reset password
      tags:
      - User
  /v1/feed:
    get:
      description: Return the current user's feed.
      operationId: getUserFeed
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 101
                content: This is a comment
                like_count: 10
                created_at: 2020-01-01T00:00:00Z
                username: johndoe
              schema:
                items:
                  $ref: "#/components/schemas/Comment"
                type: array
          description: User feed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.feed.read
      summary: Get user feed
      tags:
      - Comment
  /v1/users/{username}/comments:
    get:
      description: Get all comments for a specific user.
      operationId: getUserComments
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      - description: How many items to return at one time (max 100)
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: The number of items to skip before starting to collect the result
          set
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 123
                content: This is a comment
                like_count: 3
                created_at: 2020-01-01T00:00:00Z
                username: johndoe
              schema:
                items:
                  $ref: "#/components/schemas/Comment"
                type: array
          description: User comments
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.read
      summary: List comments for a user
      tags:
      - User
  /v1/users/{username}/followers:
    get:
      description: Get all followers for a specific user.
      operationId: getUserFollowers
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 2
                username: janedoe
                first_name: Jane
                last_name: Doe
                email: janedoe@mail.com
                created_at: 2020-01-01T00:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: User followers
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.follower.read
      summary: Get all followers for a user
      tags:
      - User
      - Following
  /v1/users/{username}/following:
    get:
      description: Get all users followed by a specific user.
      operationId: getFollowingUsers
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 3
                username: editor1
                first_name: Ed
                last_name: Itor
                email: editor1@mail.com
                created_at: 2020-01-01T00:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: Followed users
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.following.list
      summary: Get all followed users for a user
      tags:
      - User
  /v1/users/{followedUsername}/followers/{followerUsername}:
    delete:
      description: Remove a follower relationship between two users.
      operationId: unfollowUser
      parameters:
      - description: Username of the user being followed
        example: johndoe
        explode: false
        in: path
        name: followedUsername
        required: true
        schema:
          type: string
        style: simple
      - description: Username of the follower to remove
        example: jackdoe
        explode: false
        in: path
        name: followerUsername
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: User was unfollowed successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.follower.delete
      summary: Remove a user as a follower
      tags:
      - User
    post:
      description: Create a follower relationship between two users.
      operationId: followUser
      parameters:
      - description: Username of the user being followed
        example: johndoe
        explode: false
        in: path
        name: followedUsername
        required: true
        schema:
          type: string
        style: simple
      - description: Username of the follower to add
        example: jackdoe
        explode: false
        in: path
        name: followerUsername
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: User was followed successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.follower.create
      summary: Add a user as a follower
      tags:
      - User
  /v1/users/{username}:
    delete:
      description: Delete a user by username.
      operationId: deleteUser
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User was deleted successfully
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Username not found
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.delete
      summary: Deletes a particular user
      tags:
      - User
    get:
      description: Get a user by username.
      operationId: getUserByUsername
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User details by username
          headers:
            x-next:
              description: A link to the next page of responses
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Username not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.read
      summary: Get a particular user by username
      tags:
      - User
    put:
      description: Update a user by username.
      operationId: updateUser
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              username: johndoe
              first_name: John
              last_name: Updated
              email: johndoe@mail.com
            schema:
              $ref: "#/components/schemas/User"
        description: Update a user
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User was updated successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.update
      summary: Update a user
      tags:
      - User
  /v1/users/{username}/roles:
    get:
      description: Get all roles assigned to a user.
      operationId: getRolesForUser
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 1
                name: admin
                description: Administrator role
                created_at: 2020-01-01T00:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/Role"
                type: array
          description: Roles for a user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.roles.list
      summary: Get all roles for a user
      tags:
      - User
    put:
      description: Replace all roles for a user.
      operationId: updateRolesForUser
      parameters:
      - description: Username of the user
        example: johndoe
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              example:
              - administrator
              - user
              - owner
              - editor
              items:
                type: string
              type: array
        description: Update all roles for a user
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Role"
                type: array
          description: Roles for a user
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.users.roles.update
      summary: Update all roles for a user
      tags:
      - User
  /v1/comments/{id}:
    get:
      description: Get details for a specific comment.
      operationId: getComment
      parameters:
      - description: ID of the comment
        example: 123
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          pattern: ^-?\d+$
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                id: 123
                content: This is a comment
                like_count: 10
                created_at: 2020-01-01T00:00:00Z
                username: johndoe
              schema:
                $ref: "#/components/schemas/Comment"
          description: Details about a comment by ID
          headers:
            x-next:
              description: A link to the next page of responses
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.read
      summary: Get comment by ID
      tags:
      - Comment
  /v1/comments:
    get:
      description: Search comments by author and creation time.
      operationId: searchComments
      parameters:
      - description: Filter comments by the author's username.
        explode: true
        in: query
        name: username
        required: false
        schema:
          type: string
        style: form
      - description: Return comments created at or after this timestamp.
        explode: true
        in: query
        name: start_time
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Return comments created at or before this timestamp.
        explode: true
        in: query
        name: end_time
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Comment"
                type: array
          description: The most recent matching comments
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.read
      summary: Search comments
      tags:
      - Comment
    post:
      description: Create a new comment.
      operationId: createComment
      requestBody:
        content:
          application/json:
            example:
              content: This is a comment
              username: johndoe
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        description: Create a new comment
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: New comment was created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.create
      summary: Create a new comment
      tags:
      - Comment
  /like:
    delete:
      description: Remove a like from a comment as the authenticated user.
      operationId: unlikeComment
      requestBody:
        content:
          application/json:
            example:
              comment_id: 123
            schema:
              $ref: "#/components/schemas/LikeRequest"
        description: Comment unlike request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: Updated comment with the new like count
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Comment not found
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.update
      summary: Unlike a comment
      tags:
      - Comment
    post:
      description: Like a comment as the authenticated user.
      operationId: likeComment
      requestBody:
        content:
          application/json:
            example:
              comment_id: 123
            schema:
              $ref: "#/components/schemas/LikeRequest"
        description: Comment like request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
          description: Updated comment with the new like count
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Comment not found
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - OAuth2:
        - socialapp.comments.update
      summary: Like a comment
      tags:
      - Comment
  /v1/oauth/token:
    post:
      description: Exchange HTTP basic credentials for an access token.
      operationId: getAccessToken
      responses:
        "200":
          content:
            application/json:
              example:
                access_token: 123token123
                token_type: Bearer
                scopes:
                - socialapp.users.list
                expires_in: 3600
              schema:
                $ref: "#/components/schemas/AccessToken"
          description: Access token
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected error
      security:
      - BasicAuth: []
      summary: Get an access token
      tags:
      - Authentication
  /v1/roles:
    get:
      description: List roles with offset-based pagination.
      operationId: listRoles
      parameters:
      - description: The numbers of roles to return
        example: 20
        explode: false
        in: query
        name: limit
        required: false
        schema:
          default: 20
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: The number of items to skip before starting to collect the result
        example: 0
