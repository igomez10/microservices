components:
  schemas:
    CreateCommentRequest:
      description: Request payload for creating a comment.
      example:
        content: This is a comment
        username: johndoe
      properties:
        content:
          description: Text content of the comment.
          type: string
        username:
          description: Username of the comment author.
          type: string
      required:
      - content
      - username
    CreateUserRequest:
      description: Request payload for creating a user account.
      example:
        username: johndoe
        first_name: John
        last_name: Doe
        password: Secure123
        email: johndoe@mail.com
      properties:
        username:
          description: Unique username for the account.
          type: string
        password:
          description: Plain-text password used during account creation.
          type: string
        first_name:
          description: User first name.
          type: string
        last_name:
          description: User last name.
          type: string
        email:
          description: User email address.
          format: email
          type: string
      required:
      - email
      - first_name
      - last_name
      - password
      - username
    CreateUserResponse:
      description: Response payload returned after user creation.
      example:
        id: 1
        username: johndoe
        first_name: John
        last_name: Doe
        email: john@doe.com
        created_at: 2020-01-01T00:00:00.000+00:00
      properties:
        id:
          description: Unique user identifier.
          format: int64
          pattern: ^-?\d+$
          type: string
        username:
          description: Unique username for the account.
          type: string
        first_name:
          description: User first name.
          type: string
        last_name:
          description: User last name.
          type: string
        email:
          description: User email address.
          format: email
          type: string
        created_at:
          description: Timestamp when the user was created.
          format: date-time
          type: string
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - username
    User:
      description: User profile information.
      example:
        username: johndoe
        first_name: John
        last_name: Doe
        email: johndoe@mail.com
        created_at: 2020-01-01T00:00:00Z
      properties:
        id:
          description: Unique user identifier.
          format: int64
          pattern: ^-?\d+$
          type: string
        username:
          description: Unique username for the account.
          type: string
        first_name:
          description: User first name.
          type: string
        last_name:
          description: User last name.
          type: string
        email:
          description: User email address.
          format: email
          type: string
        created_at:
          description: Timestamp when the user was created.
          format: date-time
          type: string
      required:
      - email
      - first_name
      - last_name
      - username
    Comment:
      description: User-generated comment.
      example:
        content: This is a comment
        username: johndoe
      properties:
        id:
          description: Unique comment identifier.
          format: int64
          pattern: ^-?\d+$
          type: string
        content:
          description: Comment text.
          type: string
        like_count:
          description: Number of likes for the comment.
          format: int64
          pattern: ^-?\d+$
          type: string
        created_at:
          description: Timestamp when the comment was created.
          format: date-time
          type: string
        username:
          description: Username of the comment author.
          type: string
      required:
      - content
      - username
    LikeRequest:
      description: Like or unlike a comment.
      example:
        comment_id: 123
      properties:
        comment_id:
          description: Unique identifier of the comment.
          format: int64
          pattern: ^-?\d+$
          type: string
      required:
      - comment_id
    AccessToken:
      description: OAuth access token response.
      example:
        access_token: 123token123
        token_type: Bearer
        expires_in: 3600
      properties:
        access_token:
          description: Access token used for authenticated requests.
          type: string
        token_type:
          description: Type of token returned by the authorization server.
          type: string
        scopes:
          description: Granted OAuth scopes.
          items:
            type: string
          type: array
        expires_in:
          description: Access token lifetime in seconds.
          type: integer
      required:
      - access_token
      - expires_in
      - token_type
    Error:
      description: Standard error payload returned by the API.
      example:
        code: 404
        message: Not found
      properties:
        code:
          description: HTTP-like error code.
          format: int32
          type: integer
        message:
          description: Human-readable error message.
          type: string
      required:
      - code
      - message
    ChangePasswordRequest:
      description: Request payload for changing a user's password.
      example:
        old_password: Secure123!
        new_password: Secure1234!
      properties:
        old_password:
          description: Current password.
          type: string
        new_password:
          description: New password.
          type: string
      required:
      - new_password
      - old_password
    ResetPasswordRequest:
      description: Request payload for triggering a password reset.
      example:
        email: johndoe@mail.com
      properties:
        email:
          description: Email address associated with the user account.
          format: email
          type: string
      required:
      - email
    Role:
      description: Role assigned to users for authorization.
      example:
        name: admin
        description: Administrator Role
      properties:
        id:
          description: Unique role identifier.
          format: int64
          pattern: ^-?\d+$
          type: string
        name:
          description: Unique role name.
          type: string
        description:
          description: Description of what the role grants.
          type: string
        created_at:
          description: Timestamp when the role was created.
          format: date-time
          type: string
      required:
      - name
    Scope:
      description: OAuth scope used for access control.
      example:
        name: socialapp.roles.read
        description: Read roles
        id: 1
      properties:
        id:
          description: Unique scope identifier.
          format: int64
          pattern: ^-?\d+$
          type: string
        name:
          description: "Scope name (for example, `socialapp.roles.read`)."
          type: string
        description:
          description: Description of the permission granted by this scope.
          type: string
        created_at:
          description: Timestamp when the scope was created.
          format: date-time
          type: string
      required:
      - description
      - name
    URL:
      description: URL alias and metadata.
      example:
        alias: example
        url: https://example.com
        created_at: 2020-01-01T00:00:00Z
        updated_at: 2020-01-01T00:00:00Z
        deleted_at: 2020-01-01T00:00:00Z
      properties:
        url:
          description: Destination URL.
          format: uri
          type: string
        alias:
          description: Short alias used to reference the URL.
          type: string
        created_at:
          description: Timestamp when the alias was created.
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the alias was last updated.
          format: date-time
          type: string
        deleted_at:
          description: Timestamp when the alias was deleted.
          format: date-time
          type: string
      required:
      - alias
      - url
  securitySchemes:
    BasicAuth:
      scheme: basic
      type: http
    OAuth2:
      flows:
        clientCredentials:
          scopes:
            socialapp.users.list: List users
            socialapp.users.create: Create users
            socialapp.users.update: Update users
            socialapp.users.delete: Delete users
            socialapp.users.read: Read a user
            socialapp.comments.list: List comments
            socialapp.comments.create: Create comments
            socialapp.comments.update: Update comments
            socialapp.comments.delete: Delete comments
            socialapp.comments.read: Read comments
