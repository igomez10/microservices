groups:
  - name: Airflow
    rules:
      - alert: AirflowTaskFailures
        expr: increase(airflow_ti_finish{state="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          application: airflow
        annotations:
          summary: "Airflow task failures detected"
          description: "Task {{ $labels.task_id }} in DAG {{ $labels.dag_id }} has failed {{ $value }} time(s) in the last 15 minutes."

      - alert: AirflowSchedulerHealth
        expr: airflow_scheduler_tasks_running == 0 and airflow_scheduler_tasks_starving > 0
        for: 10m
        labels:
          severity: critical
          application: airflow
        annotations:
          summary: "Airflow scheduler is starving tasks"
          description: "The scheduler has {{ $value }} starving tasks and no running tasks for 10 minutes."

      - alert: AirflowExecutorCapacity
        expr: airflow_executor_open_slots == 0 and airflow_executor_queued_tasks > 5
        for: 10m
        labels:
          severity: warning
          application: airflow
        annotations:
          summary: "Airflow executor has no open slots"
          description: "No open executor slots with {{ $value }} queued tasks for 10 minutes."

      - alert: AirflowDAGDuration
        expr: airflow_dagrun_duration{status="success"} > 3600
        for: 5m
        labels:
          severity: warning
          application: airflow
        annotations:
          summary: "Airflow DAG run taking too long"
          description: "DAG {{ $labels.dag_id }} has been running for {{ $value | humanizeDuration }}."

      - alert: AirflowScheduleDelay
        expr: airflow_dagrun_schedule_delay > 300
        for: 10m
        labels:
          severity: warning
          application: airflow
        annotations:
          summary: "High Airflow schedule delay"
          description: "DAG {{ $labels.dag_id }} has a schedule delay of {{ $value | humanizeDuration }}."
