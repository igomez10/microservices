networks:
  elk:
    name: docker-elk_elk
    external: true
  dns:
    name: dns
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  default:
    external: true
    name: socialapp_default

volumes:
  prometheus_data: {}
  grafana_data: {}
  db_data: {}
  kafka-data1: {}
  kafka-data2: {}
  kafka-data3: {}
  portainer_data: {}
  letsencrypt: {}
  mimir-1-data: {}
  redis_data: {}
  loki_data: {}
  tempo_data: {}

services:
  socialapp:
    init: true
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - elk
      - default
    command:
      - "/main"
      - "--port=8086"
      - "--propertiesSubdomain=${PROPERTIES_SUBDOMAIN}"
      - "--agentURL=http://otel-collector:4317"
      - "--urlShortenerSubdomain=${URL_SHORTENER}"
      - "--urlShortenerURL=http://urlshortener:8089"
      - "--socialappSubdomain=${SOCIALAPP_SUBDOMAIN}"
      - "--kibanaSubdomain=${KIBANA_SUBDOMAIN}"
      - "--kibanaURL=http://kibana:5601"
      - "--puttyknifeDomain=puttyknife-server.${EXPOSED_HOST}"
      - "--puttyknife-url=http://puttyknife-server:8096"
      - "--jwtSecret=${JWT_SECRET}"
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:password@database:5432/socialapp?sslmode=disable
      REDIS_URL: redis://redis:6379
      LOCAL_SUBDOMAIN: socialapp.${EXPOSED_HOST}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: socialapp
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Middleware for HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      # Middleware for frontend API path rewriting
      - "traefik.http.middlewares.frontend-api-strip.stripprefix.prefixes=/api"
      # HTTPS router
      - "traefik.http.routers.socialapp1.service=socialapp"
      - "traefik.http.routers.socialapp1.entrypoints=websecure"
      - "traefik.http.routers.socialapp1.rule=Host(`socialapp.${EXPOSED_HOST}`)"
      - "traefik.http.routers.socialapp1.tls=true"
      - "traefik.http.routers.socialapp1.tls.certresolver=letsencrypt"
      # HTTP router with redirect
      - "traefik.http.routers.socialapp1-http.entrypoints=web"
      - "traefik.http.routers.socialapp1-http.rule=Host(`socialapp.${EXPOSED_HOST}`)"
      - "traefik.http.routers.socialapp1-http.middlewares=https-redirect"
      # Frontend API route on frontend host
      - "traefik.http.routers.frontend-api.service=socialapp"
      - "traefik.http.routers.frontend-api.entrypoints=websecure"
      - "traefik.http.routers.frontend-api.rule=Host(`frontend.${EXPOSED_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.frontend-api.priority=100"
      - "traefik.http.routers.frontend-api.middlewares=frontend-api-strip"
      - "traefik.http.routers.frontend-api.tls=true"
      - "traefik.http.routers.frontend-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-api-http.entrypoints=web"
      - "traefik.http.routers.frontend-api-http.rule=Host(`frontend.${EXPOSED_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.frontend-api-http.middlewares=https-redirect"
      # Service
      - "traefik.http.services.socialapp.loadbalancer.server.port=8086"

      # puttyknife-server (fixed typo)
      # HTTPS router
      - "traefik.http.routers.puttyknife-server.service=socialapp"
      - "traefik.http.routers.puttyknife-server.entrypoints=websecure"
      - "traefik.http.routers.puttyknife-server.rule=Host(`puttyknife-server.${EXPOSED_HOST}`)"
      - "traefik.http.routers.puttyknife-server.tls=true"
      - "traefik.http.routers.puttyknife-server.tls.certresolver=letsencrypt"
      # HTTP router with redirect
      - "traefik.http.routers.puttyknife-server-http.entrypoints=web"
      - "traefik.http.routers.puttyknife-server-http.rule=Host(`puttyknife-server.${EXPOSED_HOST}`)"
      - "traefik.http.routers.puttyknife-server-http.middlewares=https-redirect"

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://localhost:8086/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.rule=Host(`frontend.${EXPOSED_HOST}`)"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      # HTTP router with redirect
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.rule=Host(`frontend.${EXPOSED_HOST}`)"
      - "traefik.http.routers.frontend-http.middlewares=https-redirect"
      # Service
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:15-bookworm
    container_name: database
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-socialapp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_connections=300
    volumes:
      - ./db/setup:/docker-entrypoint-initdb.d:ro
      - ${DATABASE_DATA_DIR:-db_data}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socialapp}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  setup:
    build:
      context: setup
      dockerfile: Dockerfile
    container_name: setup
    command: ["sh", "-c", "chmod +x /setup/init.sh && /setup/init.sh"]
    restart: "no"
    depends_on:
      - database
    networks:
      - elk
      - default
    env_file:
      - .env
    volumes:
      - ./setup:/setup
      - ./db/setup/schema.sql:/schema.sql:ro

  postgres-exporter:
    container_name: postgres-exporter
    image: quay.io/prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@database:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  grafana:
    init: true
    container_name: grafana
    image: grafana/grafana:11.5.1
    user: "472"
    ports:
      - "3000:3000"
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=flameGraph
      - POSTGRESQL_PROPERTIES_PASSWORD=${POSTGRESQL_PROPERTIES_PASSWORD}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - GITHUB_ACCESSTOKEN=${GITHUB_ACCESSTOKEN}
      - GF_INSTALL_PLUGINS=redis-app
      - GF_INSTALL_PLUGINS=redis-explorer-app
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./grafana/config.monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.internal.${EXPOSED_HOST}`)"
      - "traefik.http.routers.grafana.entrypoints=websecureinternal"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.grafana-http.rule=Host(`grafana.internal.${EXPOSED_HOST}`)"
      - "traefik.http.routers.grafana-http.entrypoints=webinternal"
      - "traefik.http.routers.grafana-http.middlewares=https-redirect"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  prometheus:
    init: true
    container_name: prometheus
    image: prom/prometheus:v2.50.1
    volumes:
      - ./prometheus/:/etc/prometheus/:ro
      - ${PROMETHEUS_DATA_DIR:-prometheus_data}:/prometheus
    command:
      - "--storage.tsdb.retention.size=3GB"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    expose:
      - 9090
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.internal.${EXPOSED_HOST}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecureinternal"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.prometheus-http.rule=Host(`prometheus.internal.${EXPOSED_HOST}`)"
      - "traefik.http.routers.prometheus-http.entrypoints=webinternal"
      - "traefik.http.routers.prometheus-http.middlewares=https-redirect"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  alertmanager:
    init: true
    container_name: alertmanager
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/:/etc/alertmanager/:ro
    command:
      - "--config.file=/etc/alertmanager/${ALERTMANAGER_CONFIG_FILE:-alertmanager.yml}"
    ports:
      - "9093:9093"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    privileged: true
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc:/host/etc:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.processes"
      - "--collector.systemd"
    expose:
      - 9100
    ports:
      - "9100:9100"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  inspector:
    container_name: inspector
    image: nicolaka/netshoot
    command: sleep infinity
    ports:
      - 1243:1243
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"
    networks:
      - dns
      - default
      - elk
    environment:
      - SOCIALAPP_HOST=socialapp.${EXPOSED_HOST}
      - WHOAMI_HOST=whoami.${EXPOSED_HOST}
    extra_hosts:
      - "socialapp.${EXPOSED_HOST}:172.28.0.151"
      - "whoami.${EXPOSED_HOST}:172.28.0.151"

  cadvisor:
    init: true
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
    expose:
      - 8080
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  broker1:
    container_name: broker1
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,KRAFT://:9097,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092,PLAINTEXT_HOST://broker1.internal.${EXPOSED_HOST}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,KRAFT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_CONTROLLER_LISTENER_NAMES: KRAFT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9097,2@broker2:9098,3@broker3:9099
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "yFMG3uNHSAKhz-zUrBIhjg"
    volumes:
      - ${BROKER_DATA_DIR}:/var/lib/kafka/data
    cpus: 2
    mem_limit: 4096m
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  broker2:
    container_name: broker2
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,KRAFT://:9098,PLAINTEXT_HOST://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092,PLAINTEXT_HOST://broker2.internal.${EXPOSED_HOST}:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,KRAFT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_CONTROLLER_LISTENER_NAMES: KRAFT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9097,2@broker2:9098,3@broker3:9099
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "yFMG3uNHSAKhz-zUrBIhjg"
    volumes:
      - ${BROKER2_DATA_DIR}:/var/lib/kafka/data
    ports:
      - "29093:29093"
    cpus: 2
    mem_limit: 4096m
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-batch-size: "5000"
        loki-retries: "3"
        loki-max-backoff: "1000ms"
        loki-timeout: "1000ms"
        loki-batch-wait: "5s"
        labels: "service_name"
        max-size: "10m"
        max-file: "3"

  broker3:
    container_name: broker3
    image: confluentinc/cp-kafka:latest
    ports:
      - "29094:29094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,KRAFT://:9099,PLAINTEXT_HOST://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092,PLAINTEXT_HOST://broker3.internal.${EXPOSED_HOST}:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,KRAFT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_CONTROLLER_LISTENER_NAMES: KRAFT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
