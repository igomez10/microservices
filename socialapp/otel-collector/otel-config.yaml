receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        # - job_name: "socialapp"
        #   scrape_interval: 15s
        #   scheme: https
        #   static_configs:
        #     - targets:
        #         - socialapp.gomezignacio.com

        - job_name: "cadvisor"
          scrape_interval: 15s
          dns_sd_configs:
            - names:
                - "tasks.cadvisor"
              type: "A"
              port: 8080
          static_configs:
            - targets: ["cadvisor:8080"]

        - job_name: "node"
          scrape_interval: 15s
          static_configs:
            - targets:
                - node-exporter:9100

        - job_name: "postgres-exporter"
          scrape_interval: 15s

          static_configs:
            - targets:
                - postgres-exporter:9187
              labels:
                otel: "true"

        - job_name: "elasticsearch-exporter"
          scrape_interval: 15s
          static_configs:
            - targets:
                - elasticsearch-exporter:9114

        - job_name: "puttyknife-fr-producer"
          scrape_interval: 15s
          static_configs:
            - targets:
                - puttyknife-fr-producer:9090

        - job_name: "puttyknife-m2"
          scrape_interval: 15s
          static_configs:
            - targets:
                - puttyknife-m2:9090

        - job_name: "urlshortener"
          scrape_interval: 15s
          static_configs:
            - targets:
                - urlshortener:8082

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  # Tail-based sampling: keeps all errors/slow traces, samples 10% of normal traces
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      # Always keep traces with errors
      - name: errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always keep slow traces (>500ms)
      - name: latency-policy
        type: latency
        latency:
          threshold_ms: 500
      # Sample 10% of remaining traces
      - name: probabilistic-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp:
    endpoint: http://tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    add_metric_suffixes: true # Add _total, _info suffixes

  # DISABLED: JUST USE PROMETHEUS
  # prometheusremotewrite:
  #   resource_to_telemetry_conversion:
  #     enabled: true
  #   endpoint: "http://mimir:9009/api/v1/push"
  #   tls:
  #     insecure: true

  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # Keep debug exporter but reduce verbosity for production
  # debug:
  #   verbosity: normal
  #   sampling_initial: 5
  #   sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: []
      exporters: [otlphttp/logs]
