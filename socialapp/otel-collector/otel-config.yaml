receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        # - job_name: "socialapp"
        #   scrape_interval: 15s
        #   scheme: https
        #   static_configs:
        #     - targets:
        #         - socialapp.gomezignacio.com

        - job_name: "cadvisor"
          scrape_interval: 15s
          dns_sd_configs:
            - names:
                - "tasks.cadvisor"
              type: "A"
              port: 8080
          static_configs:
            - targets: ["cadvisor:8080"]

        - job_name: "node"
          scrape_interval: 15s
          static_configs:
            - targets:
                - node-exporter:9100

        - job_name: "postgres-exporter"
          scrape_interval: 15s

          static_configs:
            - targets:
                - postgres-exporter:9187
              labels:
                otel: "true"

        - job_name: "elasticsearch-exporter"
          scrape_interval: 15s
          static_configs:
            - targets:
                - elasticsearch-exporter:9114

        - job_name: "puttyknife-fr-producer"
          scrape_interval: 15s
          static_configs:
            - targets:
                - puttyknife-fr-producer:9090

        - job_name: "puttyknife-m2"
          scrape_interval: 15s
          static_configs:
            - targets:
                - puttyknife-m2:9090

        - job_name: "urlshortener"
          scrape_interval: 15s
          static_configs:
            - targets:
                - urlshortener:8082

        - job_name: "traefik"
          scrape_interval: 15s
          # allow insecure connections
          scheme: http
          # ignore certificate errors
          tls_config:
            insecure_skip_verify: true
          static_configs:
            - targets:
                - traefik:80

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

exporters:
  otlp:
    endpoint: http://tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  prometheusremotewrite:
    endpoint: "http://mimir:9009/api/v1/push"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus, prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
