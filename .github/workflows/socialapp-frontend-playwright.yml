name: Socialapp Frontend Playwright

on:
  pull_request:
    paths:
      - "socialapp/frontend/**"
      - "socialapp/Makefile"
      - ".github/workflows/socialapp-frontend-playwright.yml"
  push:
    branches:
      - mainline
    paths:
      - "socialapp/frontend/**"
      - "socialapp/Makefile"
      - ".github/workflows/socialapp-frontend-playwright.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: socialapp/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd socialapp/frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd socialapp/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_API_BASE_URL: https://socialapp.gomezignacio.com
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          cd socialapp
          make frontend-test-e2e
