# Builds the urlshortener container image and pushes it to GHCR, so the
# Kubernetes deployment in microservices-infrastructure has something to pull.
# Mirrors build-socialapp-image.yml; same reasoning applies — deploy-urlshortener.yml
# builds on the target host and publishes no artifact.
name: URLShortener Image

on:
  push:
    branches:
      - mainline
    paths:
      - "urlshortener/**"
      - ".github/workflows/build-urlshortener-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/urlshortener

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest_app: ${{ steps.build_app.outputs.digest }}
      digest_migrate: ${{ steps.build_migrate.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: urlshortener
          file: urlshortener/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mainline
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        id: build_migrate
        uses: docker/build-push-action@v6
        with:
          # App directory as context: the migrate image needs db/setup/schema.sql
          # as well as setup/, so it cannot use setup/ as context the way the
          # compose `setup` service does.
          context: urlshortener
          file: urlshortener/setup/Migrate.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/urlshortener-migrate:mainline
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/urlshortener-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Pin that tag in microservices-infrastructure:"
          echo "  homelab/apps/urlshortener/manifests/app.yaml"

  # ── Promotion ───────────────────────────────────────────────────────────────
  # Writes the digests this build produced into the deployment manifests, so
  # the version running in the cluster is recorded in Git. Without this step
  # the manifests would have to track a moving tag, which means no deploy
  # history, no diff to review, and no rollback other than rebuilding.
  #
  # Digests, not :<sha> tags: a digest cannot be repointed, so what Git says is
  # deployed is exactly what runs.
  #
  # Requires INFRA_REPO_TOKEN — a token with contents:write on
  # igomez10/microservices-infrastructure. The default GITHUB_TOKEN is scoped
  # to this repository and cannot push to another one.
  promote:
    needs: build
    runs-on: ubuntu-latest
    # Serialised: two image workflows finishing together would otherwise race
    # on the same branch and one push would be rejected.
    concurrency:
      group: infra-manifest-write
      cancel-in-progress: false

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: igomez10/microservices-infrastructure
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main

      - name: Pin new digests
        env:
          DIGEST_APP: ${{ needs.build.outputs.digest_app }}
          DIGEST_MIGRATE: ${{ needs.build.outputs.digest_migrate }}
        run: |
          set -euo pipefail
          if grep -q "ghcr.io/igomez10/urlshortener@" homelab/apps/urlshortener/manifests/app.yaml; then
            sed -i -E "s|ghcr.io/igomez10/urlshortener@sha256:[a-f0-9]+|ghcr.io/igomez10/urlshortener@${DIGEST_APP}|g" homelab/apps/urlshortener/manifests/app.yaml
          fi
          if grep -q "ghcr.io/igomez10/urlshortener-migrate@" homelab/apps/urlshortener/manifests/migrate.yaml; then
            sed -i -E "s|ghcr.io/igomez10/urlshortener-migrate@sha256:[a-f0-9]+|ghcr.io/igomez10/urlshortener-migrate@${DIGEST_MIGRATE}|g" homelab/apps/urlshortener/manifests/migrate.yaml
          fi

          # Compare the working tree, not whether the files matched: a rebuild
          # that produces identical digests changes nothing, and committing
          # nothing is an error.
          if git diff --quiet; then
            echo "manifests already reference these digests; nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy(urlshortener): ${GITHUB_SHA:0:12}" \
                     -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Rebase rather than force: another app's promotion may have landed
          # while this one was building.
          git pull --rebase origin main
          git push origin main
