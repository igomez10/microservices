# Builds the socialapp container images, pushes them to GitHub Container
# Registry, and pins their digests in the chart's homelab values
# (socialapp/helm/socialapp/values.homelab.yaml), which Argo CD deploys.
#
# deploy-socialapp.yml does not do this: it runs tests and then POSTs to
# the deployer service (secrets.DEPLOYER_URL), which builds from source on the target host. That
# works for the compose stack and leaves no published artifact behind.
name: Socialapp Image

on:
  push:
    branches:
      - mainline
    paths:
      - "socialapp/**"
      # The chart is deployment config, not image input: a chart-only change
      # should not rebuild and re-pin every image. It is also where `promote`
      # commits digests, so this exclusion is what stops that commit from
      # starting another build — see the promote job.
      - "!socialapp/helm/**"
      # Same for the Terraform root and the data-side manifests: neither is
      # image input, and a rebuild here would re-pin and redeploy for nothing.
      - "!socialapp/terraform/**"
      - "!socialapp/deploy/**"
      - ".github/workflows/build-socialapp-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/socialapp

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest_app: ${{ steps.build_app.outputs.digest }}
      digest_migrate: ${{ steps.build_migrate.outputs.digest }}
      digest_frontend: ${{ steps.build_frontend.outputs.digest }}
    permissions:
      contents: read
      # Required for pushing to GHCR with the built-in GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_app
        uses: docker/build-push-action@v6
        with:
          context: socialapp
          file: socialapp/Dockerfile
          push: true
          # linux/amd64 is what k8s-01 runs. arm64 is built too so the same
          # image still works on an Apple Silicon laptop and on the arm64 OCI
          # instances.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mainline
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        id: build_migrate
        uses: docker/build-push-action@v6
        with:
          # App directory as context: the migrate image needs db/setup/schema.sql
          # as well as setup/, so it cannot use setup/ as context the way the
          # compose `setup` service does.
          context: socialapp
          file: socialapp/setup/Migrate.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-migrate:mainline
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The CLI as an image, consumed by the socialapp-bootstrap Job in
      # microservices-infrastructure. Repo-root-relative context like the
      # others; the Dockerfile builds ./cmd/cli rather than the server.
      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: socialapp
          file: socialapp/Cli.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-cli:mainline
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-cli:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push integration tests image
        uses: docker/build-push-action@v6
        with:
          context: socialapp
          file: socialapp/Integration.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-tests:mainline
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-tests:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: socialapp/frontend
          file: socialapp/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-frontend:mainline
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/socialapp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "The promote job pins its digest in:"
          echo "  socialapp/helm/socialapp/values.homelab.yaml"

  # ── Promotion ───────────────────────────────────────────────────────────────
  # Writes the digests this build produced into the deployment values, so
  # the version running in the cluster is recorded in Git. Without this step
  # the manifests would have to track a moving tag, which means no deploy
  # history, no diff to review, and no rollback other than rebuilding.
  #
  # Digests, not :<sha> tags: a digest cannot be repointed, so what Git says is
  # deployed is exactly what runs.
  #
  # Commits to this repo's mainline — the branch whose pushes trigger this
  # workflow — with the default GITHUB_TOKEN. That cannot loop, for two
  # independent reasons: GitHub never starts workflow runs from a
  # GITHUB_TOKEN push, and the file it changes is under socialapp/helm/**,
  # which the `paths` filter above excludes. Keep both. Swapping in a PAT
  # removes the first; moving the values file out of socialapp/helm removes
  # the second.
  promote:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialised: two runs finishing together would otherwise race on mainline
    # and one push would be rejected.
    concurrency:
      group: socialapp-promote
      cancel-in-progress: false

    steps:
      # The tip of mainline, not the commit that triggered this run: another
      # push may have landed while the images were building.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mainline

      - name: Pin new digests
        env:
          DIGEST_APP: ${{ needs.build.outputs.digest_app }}
          DIGEST_MIGRATE: ${{ needs.build.outputs.digest_migrate }}
          DIGEST_FRONTEND: ${{ needs.build.outputs.digest_frontend }}
        run: |
          set -euo pipefail
          # All three images are pinned in the chart's homelab values file.
          # The patterns are distinct: `socialapp@` cannot match
          # `socialapp-migrate@`.
          VALUES=socialapp/helm/socialapp/values.homelab.yaml
          sed -i -E "s|ghcr.io/igomez10/socialapp@sha256:[a-f0-9]+|ghcr.io/igomez10/socialapp@${DIGEST_APP}|g" "$VALUES"
          sed -i -E "s|ghcr.io/igomez10/socialapp-migrate@sha256:[a-f0-9]+|ghcr.io/igomez10/socialapp-migrate@${DIGEST_MIGRATE}|g" "$VALUES"
          sed -i -E "s|ghcr.io/igomez10/socialapp-frontend@sha256:[a-f0-9]+|ghcr.io/igomez10/socialapp-frontend@${DIGEST_FRONTEND}|g" "$VALUES"

          # Compare the working tree, not whether the files matched: a rebuild
          # that produces identical digests changes nothing, and committing
          # nothing is an error.
          if git diff --quiet; then
            echo "values already reference these digests; nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          git commit -m "deploy(socialapp): ${GITHUB_SHA:0:12}" \
                     -m "Built from ${GITHUB_SHA}"
          # Rebase rather than force: another push may have landed on mainline
          # while this one was building.
          git pull --rebase origin mainline
          git push origin HEAD:mainline
