name: Socialapp Deploy

on:
  push:
    branches:
      - mainline
    paths:
      - "socialapp/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: socialapp/go.sum

      - name: Install Pact CLI
        run: |
          go install github.com/pact-foundation/pact-go/v2@v2.4.2
          pact-go -l DEBUG install --libDir /tmp

      - name: Run unit tests
        run: |
          cd socialapp
          APP_HOST=$APP_HOST make test-ci

      # - name: Run contract tests
      #   run: ./scripts/run-contract-tests.sh

      - name: Run e2e tests
        run: |
          cd socialapp
          make test-e2e

      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 600 \
            -X POST https://deployer.gomezignacio.com/deploy \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\": \"socialapp\", \"commit\": \"${{ github.sha }}\"}"
