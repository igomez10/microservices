name: Socialapp Deploy

on:
  pull_request:
    paths:
      - "socialapp/**"
      # The Terraform root and the cluster manifests do not reach the compose
      # stack this workflow deploys.
      - "!socialapp/terraform/**"
      - "!socialapp/deploy/**"
      # The Helm chart, including the digest commits build-socialapp-image.yml
      # makes to its values.homelab.yaml, is the cluster's; the compose stack
      # never reads it.
      - "!socialapp/helm/**"
      - ".github/workflows/deploy-socialapp.yml"
  push:
    branches:
      - mainline
    paths:
      - "socialapp/**"
      # The Terraform root and the cluster manifests do not reach the compose
      # stack this workflow deploys.
      - "!socialapp/terraform/**"
      - "!socialapp/deploy/**"
      # The Helm chart, including the digest commits build-socialapp-image.yml
      # makes to its values.homelab.yaml, is the cluster's; the compose stack
      # never reads it.
      - "!socialapp/helm/**"
      - ".github/workflows/deploy-socialapp.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: socialapp/go.sum

      - name: Check gofmt
        run: |
          cd socialapp
          UNFORMATTED="$(gofmt -l $(find . -name '*.go' -not -path './socialappapi/*' -not -path './client/*'))"
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: |
          cd socialapp
          go vet ./...

      - name: Run unit tests
        run: |
          cd socialapp
          make test-ci

      - name: Run backend e2e tests
        run: |
          cd socialapp
          make test-e2e

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/mainline')
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # A secret rather than a repository variable: this repo is public,
          # and so are its Actions logs. Secrets are masked in them; variables
          # are printed in the clear.
          DEPLOYER_URL: ${{ secrets.DEPLOYER_URL }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 600 \
            -X POST "$DEPLOYER_URL/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\": \"socialapp\", \"commit\": \"${{ github.sha }}\"}"
