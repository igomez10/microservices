name: URLShortener Deploy

on:
  push:
    branches:
      - mainline
    paths:
      - 'urlshortener/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 600 \
            -X POST https://deployer.gomezignacio.com/deploy \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project\": \"urlshortener\", \"commit\": \"${{ github.sha }}\"}"
