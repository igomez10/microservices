# Homelab values for this chart, layered over values.yaml beside it. Rendered
# by the `urlshortener-app` Argo CD Application (../../terraform/argocd.tf).
#
# values.yaml owns the chart's defaults; this file owns what is specific to the
# homelab cluster, including exactly which image digests run.
#
# It lives inside the chart directory for one reason: the image workflow
# commits digests here, and urlshortener/helm/** is excluded from that
# workflow's own trigger. A digest commit therefore cannot start another build,
# whatever token pushed it.

# Pinned by digest, so the running version is recorded in Git and a rollback is
# a revert. The URLShortener Image workflow
# (.github/workflows/build-urlshortener-image.yml) rewrites both image lines on
# each build.
image: ghcr.io/igomez10/urlshortener@sha256:a2c6402e1e1eff24f2a050c3984cc7c1113b3b691cfa6ba6283bc7edaff2cb58

# The shared cluster collector (homelab/apps/otel-collector), the same endpoint
# socialapp and puttyknife use.
otelEndpoint: http://otel-collector.observability.svc.cluster.local:4317

migrate:
  image: ghcr.io/igomez10/urlshortener-migrate@sha256:862589724139711ea2fa3b148fbe546dee95addd391c8666abcf9db4f6d230c5
