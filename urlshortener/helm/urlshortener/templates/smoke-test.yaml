{{- if .Values.smokeTest.enabled }}
# Post-deploy smoke test, run after every Argo CD sync. If it fails, the sync
# fails. Read-only on purpose: it never creates a short URL, because there is
# no separate test database and anything it wrote would be served forever.
apiVersion: batch/v1
kind: Job
metadata:
  name: urlshortener-smoke-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # No retries: a rerun that passes would hide a real failure.
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urlshortener-smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: {{ .Values.smokeTest.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command: [sh, -c]
          args:
            - |
              set -eu

              SVC=http://urlshortener.{{ .Release.Namespace }}.svc.cluster.local

              check() {
                name="$1"; url="$2"; expect="$3"
                code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")"
                if [ "$code" = "$expect" ]; then
                  echo "ok    $name ($code)"
                else
                  echo "FAIL  $name: expected $expect, got $code  [$url]" >&2
                  return 1
                fi
              }

              # The process started and its config parsed. /health is on the
              # meta listener, not the API port.
              check "meta /health" "$SVC:{{ .Values.metaPort }}/health" 200

              # The API listener answers and routes. An unknown alias is a 404.
              # This does not prove the database is reachable: GetUrl maps
              # every lookup error to 404 too (pkg/controllers/url/url.go).
              check "api unknown alias" "$SVC:{{ .Values.port }}/v1/urls/smoke-test-nonexistent-alias" 404

              echo "smoke tests passed"
{{- end }}
